        endsAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        goals:
          type: array
          items: { $ref: '#/components/schemas/TreatmentGoal' }
    ClinicalRecord:
      type: object
      additionalProperties: false
      required: [id, status, openedAt, patient, careRelationshipId, encounters, treatmentPlans, nextCursor]
      properties:
        id: { type: [string, 'null'], format: uuid }
        status: { type: [string, 'null'], enum: [OPEN, CLOSED, ARCHIVED, null] }
        openedAt: { type: [string, 'null'], format: date-time }
        patient:
          type: object
          additionalProperties: false
          required: [userId, displayName, photoUrl]
          properties:
            userId: { type: string, format: uuid }
            displayName: { type: string, minLength: 1, maxLength: 160 }
            photoUrl: { type: [string, 'null'], format: uri }
        careRelationshipId: { type: string, format: uuid }
        encounters:
          type: array
          items: { $ref: '#/components/schemas/ClinicalEncounter' }
        treatmentPlans:
          type: array
          items: { $ref: '#/components/schemas/TreatmentPlan' }
        nextCursor: { type: [string, 'null'] }
    ClinicalRecordResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ClinicalRecord' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ClinicalNoteVersion:
      type: object
      additionalProperties: false
      required: [id, versionNumber, content, amendmentReason, createdAt, author]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        content: { type: string, minLength: 1, maxLength: 100000 }
        amendmentReason: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        author:
          type: object
          additionalProperties: false
          required: [userId, displayName]
          properties:
            userId: { type: string, format: uuid }
            displayName: { type: string, minLength: 1, maxLength: 160 }
    ClinicalNoteVersionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClinicalNoteVersion' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CreateClinicalEncounterRequest:
      type: object
      additionalProperties: false
      required: [patientUserId, startedAt, noteContent]
      properties:
        patientUserId: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
        noteContent: { type: string, minLength: 1, maxLength: 100000 }
    UpdateClinicalDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, content]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        content: { type: string, minLength: 1, maxLength: 100000 }
    SignClinicalNoteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    AmendClinicalNoteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, content, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        content: { type: string, minLength: 1, maxLength: 100000 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    CreateTreatmentPlanRequest:
      type: object
      additionalProperties: false
      required: [patientUserId, summary, goals]
      properties:
        patientUserId: { type: string, format: uuid }
        summary: { type: string, minLength: 1, maxLength: 20000 }
        startsAt: { type: string, format: date-time }
        goals:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [description]
            properties:
              description: { type: string, minLength: 1, maxLength: 2000 }
              targetDate: { type: string, format: date }
    TreatmentPlanResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TreatmentPlan' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    TreatmentPlanTransitionRequest:
      type: object
      additionalProperties: false
      required: [transition]
      properties:
        transition: { type: string, enum: [ACTIVATE, COMPLETE, CANCEL] }
    TreatmentGoalStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, IN_PROGRESS, ACHIEVED, CANCELLED] }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Falta una cabecera obligatoria o la solicitud no puede interpretarse.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: La sesión no es válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: La identidad no posee la capacidad requerida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: El recurso no existe o no puede revelarse al actor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: El recurso ya existe o cambió de estado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: La entrada no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Se excedió el límite permitido.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: El servicio aún no está listo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
security:
  - bearerAuth: []
