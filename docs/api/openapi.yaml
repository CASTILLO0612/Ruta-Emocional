openapi: 3.1.0
info:
  title: Ruta Emocional API
  version: 1.0.0-draft
  description: Contrato ejecutable de identidad, directorio profesional, verificación, solicitudes y ofertas.
servers:
  - url: http://localhost:5000/api/v1
    description: Desarrollo local
tags:
  - name: Health
  - name: Auth
  - name: Catalogs
  - name: Directory
  - name: Professional profile
  - name: Professional verification
  - name: Service requests
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: El proceso está activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Dependencias críticas disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register/patient:
    post:
      tags: [Auth]
      operationId: registerPatient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '201':
          description: Cuenta y perfil de paciente creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register/psychologist:
    post:
      tags: [Auth]
      operationId: registerPsychologist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPsychologistRequest'
      responses:
        '201':
          description: Cuenta, perfil y licencia pendiente creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 40
                  maxLength: 300
      responses:
        '200':
          description: Tokens rotados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Sesión actual revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      responses:
        '204':
          description: Todas las sesiones del usuario fueron revocadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Identidad y capacidades actuales.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/CurrentUser'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /catalogs/specialties:
    get:
      tags: [Catalogs]
      operationId: listSpecialties
      security: []
      responses:
        '200':
          description: Especialidades activas, ordenadas por nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialtyListResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogs/modalities:
    get:
      tags: [Catalogs]
      operationId: listModalities
      security: []
      responses:
        '200':
          description: Códigos de modalidad y monedas habilitadas por configuración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModalityCatalogResponse'
  /psychologists:
    get:
      tags: [Directory]
      operationId: listPublicPsychologists
      security: []
      parameters:
        - { name: specialty, in: query, schema: { type: string, maxLength: 60 } }
        - { name: modality, in: query, schema: { $ref: '#/components/schemas/Modality' } }
        - { name: minPrice, in: query, schema: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$' } }
        - { name: maxPrice, in: query, schema: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$' } }
        - { name: availableFrom, in: query, schema: { type: string, format: date-time } }
        - { name: availableUntil, in: query, schema: { type: string, format: date-time } }
        - { name: latitude, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: 0 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Página estable de perfiles públicos verificados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfessionalPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /psychologists/{psychologistId}:
    get:
      tags: [Directory]
      operationId: getPublicPsychologist
      security: []
      parameters:
        - name: psychologistId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil público minimizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfessionalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /psychologists/me:
    get:
      tags: [Professional profile]
      operationId: getOwnProfessionalProfile
      responses:
        '200':
          description: Expediente del profesional autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfessionalResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Professional profile]
      operationId: updateOwnProfessionalProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bio]
              properties:
                bio: { type: [string, 'null'], minLength: 20, maxLength: 3000 }
      responses:
        '200':
          description: Expediente actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/specialties:
    put:
      tags: [Professional profile]
      operationId: replaceOwnProfessionalSpecialties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [specialtyCodes, primarySpecialtyCode]
              properties:
                specialtyCodes:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, maxLength: 60 }
                primarySpecialtyCode: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Especialidades reemplazadas atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/modalities/{modality}:
    put:
      tags: [Professional profile]
      operationId: configureOwnProfessionalModality
      parameters:
        - name: modality
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Modality' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModalityConfigurationRequest' }
      responses:
        '200':
          description: Modalidad configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/availability:
    put:
      tags: [Professional profile]
      operationId: replaceOwnWeeklyAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyAvailabilityRequest' }
      responses:
        '200':
          description: Reglas semanales reemplazadas atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/availability-exceptions:
    post:
      tags: [Professional profile]
      operationId: createOwnAvailabilityException
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityExceptionRequest' }
      responses:
        '201':
          description: Excepción creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/verification-submissions:
    post:
      tags: [Professional verification]
      operationId: submitProfessionalEvidence
      description: Registra la referencia de un objeto ya almacenado en almacenamiento privado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationSubmissionRequest' }
      responses:
        '201':
          description: Evidencia registrada como pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/catalogs/specialties:
    post:
      tags: [Catalogs]
      operationId: createSpecialty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Specialty' }
      responses:
        '201':
          description: Especialidad creada y auditada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialtyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/catalogs/specialties/{code}:
    patch:
      tags: [Catalogs]
      operationId: setSpecialtyStatus
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, maxLength: 60 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200':
          description: Estado del catálogo actualizado y auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialtyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/psychologist-verifications:
    get:
      tags: [Professional verification]
      operationId: listPendingProfessionalVerifications
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Cola paginada de evidencias pendientes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationQueueResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/psychologist-verifications/{submissionId}/decision:
    post:
      tags: [Professional verification]
      operationId: decideProfessionalVerification
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationDecisionRequest' }
      responses:
        '204': { description: Decisión persistida, auditada y publicada en outbox. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests:
    post:
      tags: [Service requests]
      operationId: createServiceRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequestRequest' }
      responses:
        '201':
          description: Solicitud creada o resultado idempotente recuperado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /service-requests/me:
    get:
      tags: [Service requests]
      operationId: listOwnServiceRequests
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ServiceRequestStatus' } }
      responses:
        '200':
          description: Página de solicitudes del paciente autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/policy:
    get:
      tags: [Service requests]
      operationId: getServiceRequestPolicy
      responses:
        '200':
          description: Límites públicos del flujo para el cliente autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestPolicyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /service-requests/eligible:
    get:
      tags: [Service requests]
      operationId: listEligibleServiceRequests
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, BIDDING] } }
      responses:
        '200':
          description: Proyección minimizada de solicitudes abiertas compatibles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleServiceRequestPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{requestId}:
    get:
      tags: [Service requests]
      operationId: getServiceRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud visible por propiedad, oferta propia o elegibilidad actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{requestId}/cancel:
    post:
      tags: [Service requests]
      operationId: cancelServiceRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud propia cancelada; no admite cuerpo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{requestId}/offers:
    post:
      tags: [Service requests]
      operationId: createOwnServiceOffer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceOfferRequest' }
      responses:
        '201':
          description: Oferta única atribuida al profesional autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOfferResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Service requests]
      operationId: listServiceRequestOffers
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Ofertas visibles únicamente para el paciente propietario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOfferListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{requestId}/offers/{offerId}/withdraw:
    post:
      tags: [Service requests]
      operationId: withdrawOwnServiceOffer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Oferta propia pendiente retirada; no admite cuerpo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOfferResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{requestId}/offers/{offerId}/accept:
    post:
      tags: [Service requests]
      operationId: acceptServiceOffer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Oferta aceptada, competidoras rechazadas y relación creada atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptanceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterPatientRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    RegisterPsychologistRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, license]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        license:
          type: object
          additionalProperties: false
          required: [authority, number]
          properties:
            authority:
              type: string
              minLength: 2
              maxLength: 120
            number:
              type: string
              minLength: 4
              maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
        deviceName:
          type: string
          maxLength: 160
    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user, tokens]
          properties:
            user:
              $ref: '#/components/schemas/CurrentUser'
            tokens:
              $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TokenPairResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresInSeconds, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
        accessTokenExpiresInSeconds:
          type: integer
          minimum: 60
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    CurrentUser:
      type: object
      required: [id, displayName, email, status, roles, capabilities]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        photoUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DISABLED]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [patient, psychologist, administrator, clinical_auditor]
        psychologistVerificationStatus:
          type: [string, 'null']
          enum: [PENDING, VERIFIED, REJECTED, null]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    Modality:
      type: string
      enum: [CHAT, CALL, IN_PERSON]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Specialty:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 60, pattern: '^[A-Z0-9]+(?:_[A-Z0-9]+)*$' }
        name: { type: string, minLength: 2, maxLength: 120 }
    SpecialtyResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Specialty' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SpecialtyListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Specialty' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ModalityCatalogResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [codes, currencies]
          properties:
            codes:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/Modality' }
            currencies:
              type: array
              uniqueItems: true
              items: { type: string, pattern: '^[A-Z]{3}$' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicProfessional:
      type: object
      additionalProperties: false
      required: [id, displayName, photoUrl, bio, specialties, primarySpecialty, modalities, rating, availability, credential]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'] }
        specialties:
          type: array
          items: { $ref: '#/components/schemas/Specialty' }
        primarySpecialty:
          oneOf:
            - { $ref: '#/components/schemas/Specialty' }
            - { type: 'null' }
        modalities:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, pricePerHour]
            properties:
              code: { $ref: '#/components/schemas/Modality' }
              pricePerHour: { $ref: '#/components/schemas/Money' }
        rating:
          type: object
          required: [average, count]
          properties:
            average: { type: [string, 'null'] }
            count: { type: integer, minimum: 0 }
        availability:
          type: object
          required: [hasWeeklySchedule]
          properties:
            hasWeeklySchedule: { type: boolean }
        credential:
          description: Proyección deliberadamente sin número de licencia ni evidencia.
          type: object
          additionalProperties: false
          required: [authority, status]
          properties:
            authority: { type: string }
            status: { type: string, const: VERIFIED }
        approximateDistanceKm:
          type: string
          pattern: '^[0-9]+\.[0-9]$'
    PublicProfessionalResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicProfessional' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicProfessionalPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicProfessional' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [nextCursor]
              properties:
                nextCursor: { type: [string, 'null'] }
    ProfessionalLicense:
      type: object
      required: [id, authority, number, status, evidenceSubmitted, latestPublicDecisionReason]
      properties:
        id: { type: string, format: uuid }
        authority: { type: string }
        number: { type: string }
        status: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        evidenceSubmitted: { type: boolean }
        latestPublicDecisionReason: { type: [string, 'null'] }
    WeeklyAvailabilityRule:
      type: object
      additionalProperties: false
      required: [weekday, startTime, endTime, isActive]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        effectiveFrom: { type: string, format: date }
        effectiveUntil: { type: string, format: date }
        isActive: { type: boolean }
    OwnProfessional:
      type: object
      required: [id, userId, displayName, email, bio, verificationStatus, specialties, modalities, licenses, availability]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        photoUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'] }
        verificationStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        specialties:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Specialty' }
              - type: object
                required: [isPrimary]
                properties: { isPrimary: { type: boolean } }
        modalities:
          type: array
          items:
            type: object
            required: [code, pricePerHour, isEnabled]
            properties:
              code: { $ref: '#/components/schemas/Modality' }
              pricePerHour: { $ref: '#/components/schemas/Money' }
              isEnabled: { type: boolean }
        licenses:
          type: array
          items: { $ref: '#/components/schemas/ProfessionalLicense' }
        availability:
          type: object
          required: [timezone, weeklyRules, exceptions]
          properties:
            timezone: { type: [string, 'null'] }
            weeklyRules:
              type: array
              items: { $ref: '#/components/schemas/WeeklyAvailabilityRule' }
            exceptions:
              type: array
              items:
                type: object
                required: [id, startsAt, endsAt, type, reason]
                properties:
                  id: { type: string, format: uuid }
                  startsAt: { type: string, format: date-time }
                  endsAt: { type: string, format: date-time }
                  type: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
                  reason: { type: [string, 'null'] }
    OwnProfessionalResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/OwnProfessional' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ModalityConfigurationRequest:
      type: object
      additionalProperties: false
      required: [pricePerHour, isEnabled]
      properties:
        pricePerHour: { $ref: '#/components/schemas/Money' }
        isEnabled: { type: boolean }
    WeeklyAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [timezone, rules]
      properties:
        timezone: { type: string, maxLength: 80 }
        rules:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/WeeklyAvailabilityRule' }
    AvailabilityExceptionRequest:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt, type]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        type: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        reason: { type: string, maxLength: 240 }
    VerificationSubmissionRequest:
      type: object
      additionalProperties: false
      required: [licenseId, evidenceObjectKey]
      properties:
        licenseId: { type: string, format: uuid }
        evidenceObjectKey:
          type: string
          minLength: 8
          maxLength: 512
          description: Clave opaca de almacenamiento privado; nunca una URL pública.
    VerificationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        publicReason: { type: string, minLength: 10, maxLength: 500 }
        internalReason: { type: string, maxLength: 1000 }
    VerificationQueueResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [submissionId, psychologistProfileId, psychologistName, license, evidenceObjectKey, submittedAt]
            properties:
              submissionId: { type: string, format: uuid }
              psychologistProfileId: { type: string, format: uuid }
              psychologistName: { type: string }
              license:
                type: object
                required: [id, authority, number]
                properties:
                  id: { type: string, format: uuid }
                  authority: { type: string }
                  number: { type: string }
              evidenceObjectKey: { type: string }
              submittedAt: { type: string, format: date-time }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [nextCursor]
              properties:
                nextCursor: { type: [string, 'null'] }
    MoneyInput:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ServiceRequestStatus:
      type: string
      enum: [PENDING, BIDDING, ACCEPTED, IN_SESSION, COMPLETED, CANCELLED, EXPIRED]
    CreateServiceRequestRequest:
      type: object
      additionalProperties: false
      required: [modality, proposedBudget, timing]
      properties:
        modality: { $ref: '#/components/schemas/Modality' }
        primaryNeed: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        proposedBudget: { $ref: '#/components/schemas/MoneyInput' }
        timing:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, const: IMMEDIATE }
            - type: object
              additionalProperties: false
              required: [kind, scheduledFor]
              properties:
                kind: { type: string, const: SCHEDULED }
                scheduledFor: { type: string, format: date-time }
        location:
          type: object
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
    AcceptedOfferSummary:
      type: object
      additionalProperties: false
      required: [id, psychologistProfileId, price]
      properties:
        id: { type: string, format: uuid }
        psychologistProfileId: { type: string, format: uuid }
        price: { $ref: '#/components/schemas/Money' }
    ServiceRequest:
      type: object
      additionalProperties: false
      required: [id, modality, primaryNeed, description, proposedBudget, status, scheduledFor, expiresAt, createdAt, updatedAt, acceptedOffer]
      properties:
        id: { type: string, format: uuid }
        modality: { $ref: '#/components/schemas/Modality' }
        primaryNeed: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        proposedBudget: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/ServiceRequestStatus' }
        scheduledFor: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        acceptedOffer:
          oneOf:
            - { $ref: '#/components/schemas/AcceptedOfferSummary' }
            - { type: 'null' }
    EligibleServiceRequest:
      type: object
      additionalProperties: false
      description: No contiene identidad ni ubicación exacta del paciente.
      required: [id, modality, primaryNeed, description, proposedBudget, status, scheduledFor, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        modality: { $ref: '#/components/schemas/Modality' }
        primaryNeed: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        proposedBudget: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [PENDING, BIDDING] }
        scheduledFor: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ServiceRequestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ServiceRequest' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ServiceRequestPageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequest' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [nextCursor]
              properties: { nextCursor: { type: [string, 'null'] } }
    EligibleServiceRequestPageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EligibleServiceRequest' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [nextCursor]
              properties: { nextCursor: { type: [string, 'null'] } }
    ServiceRequestPolicy:
      type: object
      additionalProperties: false
      required: [minimumAmount, maximumAmount, supportedCurrencies, immediateTtlMinutes, scheduledLeadMinutes, maximumScheduleDays, maximumDescriptionLength, maximumPrimaryNeedLength, maximumOfferMessageLength]
      properties:
        minimumAmount: { type: string }
        maximumAmount: { type: string }
        supportedCurrencies:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z]{3}$' }
        immediateTtlMinutes: { type: integer, minimum: 1 }
        scheduledLeadMinutes: { type: integer, minimum: 1 }
        maximumScheduleDays: { type: integer, minimum: 1 }
        maximumDescriptionLength: { type: integer, minimum: 1 }
        maximumPrimaryNeedLength: { type: integer, minimum: 1 }
        maximumOfferMessageLength: { type: integer, minimum: 1 }
    ServiceRequestPolicyResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ServiceRequestPolicy' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CreateServiceOfferRequest:
      type: object
      additionalProperties: false
      required: [price]
      properties:
        price:
          type: object
          additionalProperties: false
          required: [amount]
          properties:
            amount: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$' }
        message: { type: string, minLength: 1, maxLength: 500 }
    ProfessionalOfferSummary:
      type: object
      additionalProperties: false
      required: [profileId, displayName, photoUrl, primarySpecialty, rating, totalReviews]
      properties:
        profileId: { type: string, format: uuid }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
        primarySpecialty: { type: [string, 'null'] }
        rating: { type: number, minimum: 0, maximum: 5 }
        totalReviews: { type: integer, minimum: 0 }
    ServiceOffer:
      type: object
      additionalProperties: false
      required: [id, requestId, professional, price, message, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        professional: { $ref: '#/components/schemas/ProfessionalOfferSummary' }
        price: { $ref: '#/components/schemas/Money' }
        message: { type: [string, 'null'] }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, WITHDRAWN] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceOfferResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ServiceOffer' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ServiceOfferListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ServiceOffer' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AcceptanceResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [request, acceptedOffer, careRelationshipId, replayed]
          properties:
            request: { $ref: '#/components/schemas/ServiceRequest' }
            acceptedOffer: { $ref: '#/components/schemas/ServiceOffer' }
            careRelationshipId: { type: string, format: uuid }
            replayed: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Falta una cabecera obligatoria o la solicitud no puede interpretarse.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: La sesión no es válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: La identidad no posee la capacidad requerida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: El recurso no existe o no puede revelarse al actor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: El recurso ya existe o cambió de estado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: La entrada no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Se excedió el límite permitido.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: El servicio aún no está listo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
security:
  - bearerAuth: []
