        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientUserId:
      name: patientUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClinicalNoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TreatmentPlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TreatmentGoalId:
      name: goalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterPatientRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    RegisterPsychologistRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, license]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        license:
          type: object
          additionalProperties: false
          required: [authority, number]
          properties:
            authority:
              type: string
              minLength: 2
              maxLength: 120
            number:
              type: string
              minLength: 4
              maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
        deviceName:
          type: string
          maxLength: 160
    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user, tokens]
          properties:
            user:
              $ref: '#/components/schemas/CurrentUser'
            tokens:
              $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TokenPairResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresInSeconds, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
        accessTokenExpiresInSeconds:
          type: integer
          minimum: 60
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    CurrentUser:
      type: object
      required: [id, displayName, email, status, roles, capabilities]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        photoUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DISABLED]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [patient, psychologist, administrator, clinical_auditor]
        psychologistVerificationStatus:
          type: [string, 'null']
          enum: [PENDING, VERIFIED, REJECTED, null]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    Modality:
      type: string
      enum: [CHAT, CALL, IN_PERSON]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Specialty:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 60, pattern: '^[A-Z0-9]+(?:_[A-Z0-9]+)*$' }
        name: { type: string, minLength: 2, maxLength: 120 }
    SpecialtyResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Specialty' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SpecialtyListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Specialty' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ModalityCatalogResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [codes, currencies]
          properties:
            codes:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/Modality' }
            currencies:
              type: array
              uniqueItems: true
              items: { type: string, pattern: '^[A-Z]{3}$' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicProfessional:
      type: object
      additionalProperties: false
      required: [id, displayName, photoUrl, bio, specialties, primarySpecialty, modalities, rating, availability, credential]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'] }
        specialties:
          type: array
          items: { $ref: '#/components/schemas/Specialty' }
        primarySpecialty:
          oneOf:
            - { $ref: '#/components/schemas/Specialty' }
            - { type: 'null' }
        modalities:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, pricePerHour]
            properties:
              code: { $ref: '#/components/schemas/Modality' }
              pricePerHour: { $ref: '#/components/schemas/Money' }
        rating:
          type: object
          required: [average, count]
          properties:
            average: { type: [string, 'null'] }
            count: { type: integer, minimum: 0 }
        availability:
          type: object
          required: [hasWeeklySchedule]
          properties:
            hasWeeklySchedule: { type: boolean }
        credential:
          description: Proyección deliberadamente sin número de licencia ni evidencia.
          type: object
          additionalProperties: false
          required: [authority, status]
          properties:
            authority: { type: string }
            status: { type: string, const: VERIFIED }
        approximateDistanceKm:
          type: string
          pattern: '^[0-9]+\.[0-9]$'
    PublicProfessionalResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicProfessional' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicProfessionalPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicProfessional' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [nextCursor]
              properties:
                nextCursor: { type: [string, 'null'] }
    ProfessionalLicense:
      type: object
      required: [id, authority, number, status, evidenceSubmitted, latestPublicDecisionReason]
      properties:
        id: { type: string, format: uuid }
        authority: { type: string }
        number: { type: string }
        status: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        evidenceSubmitted: { type: boolean }
        latestPublicDecisionReason: { type: [string, 'null'] }
    WeeklyAvailabilityRule:
      type: object
      additionalProperties: false
      required: [weekday, startTime, endTime, isActive]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        effectiveFrom: { type: string, format: date }
        effectiveUntil: { type: string, format: date }
        isActive: { type: boolean }
    OwnProfessional:
      type: object
      required: [id, userId, displayName, email, bio, verificationStatus, specialties, modalities, licenses, availability]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        photoUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'] }
