openapi: 3.1.0
info:
  title: Ruta Emocional API
  version: 1.0.0-draft
  description: Contrato ejecutable de identidad, directorio, solicitudes, mensajería, agenda e historia clínica segura.
servers:
  - url: http://localhost:5000/api/v1
    description: Desarrollo local
tags:
  - name: Health
  - name: Auth
  - name: Catalogs
  - name: Directory
  - name: Professional profile
  - name: Professional verification
  - name: Service requests
  - name: Messaging
  - name: Appointments
  - name: Clinical records
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: El proceso está activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Dependencias críticas disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register/patient:
    post:
      tags: [Auth]
      operationId: registerPatient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '201':
          description: Cuenta y perfil de paciente creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register/psychologist:
    post:
      tags: [Auth]
      operationId: registerPsychologist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPsychologistRequest'
      responses:
        '201':
          description: Cuenta, perfil y licencia pendiente creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 40
                  maxLength: 300
      responses:
        '200':
          description: Tokens rotados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Sesión actual revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      responses:
        '204':
          description: Todas las sesiones del usuario fueron revocadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Identidad y capacidades actuales.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/CurrentUser'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /catalogs/specialties:
    get:
      tags: [Catalogs]
      operationId: listSpecialties
      security: []
      responses:
        '200':
          description: Especialidades activas, ordenadas por nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialtyListResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogs/modalities:
    get:
      tags: [Catalogs]
      operationId: listModalities
      security: []
      responses:
        '200':
          description: Códigos de modalidad y monedas habilitadas por configuración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModalityCatalogResponse'
  /psychologists:
    get:
      tags: [Directory]
      operationId: listPublicPsychologists
      security: []
      parameters:
        - { name: specialty, in: query, schema: { type: string, maxLength: 60 } }
        - { name: modality, in: query, schema: { $ref: '#/components/schemas/Modality' } }
        - { name: minPrice, in: query, schema: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$' } }
        - { name: maxPrice, in: query, schema: { type: string, pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$' } }
        - { name: availableFrom, in: query, schema: { type: string, format: date-time } }
        - { name: availableUntil, in: query, schema: { type: string, format: date-time } }
        - { name: latitude, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: 0 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Página estable de perfiles públicos verificados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfessionalPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /psychologists/{psychologistId}:
    get:
      tags: [Directory]
      operationId: getPublicPsychologist
      security: []
      parameters:
        - name: psychologistId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil público minimizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfessionalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /psychologists/me:
    get:
      tags: [Professional profile]
      operationId: getOwnProfessionalProfile
      responses:
        '200':
          description: Expediente del profesional autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfessionalResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Professional profile]
      operationId: updateOwnProfessionalProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bio]
              properties:
                bio: { type: [string, 'null'], minLength: 20, maxLength: 3000 }
      responses:
        '200':
          description: Expediente actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/specialties:
    put:
      tags: [Professional profile]
      operationId: replaceOwnProfessionalSpecialties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [specialtyCodes, primarySpecialtyCode]
              properties:
                specialtyCodes:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, maxLength: 60 }
                primarySpecialtyCode: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Especialidades reemplazadas atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/modalities/{modality}:
    put:
      tags: [Professional profile]
      operationId: configureOwnProfessionalModality
      parameters:
        - name: modality
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Modality' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModalityConfigurationRequest' }
      responses:
        '200':
          description: Modalidad configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/availability:
    put:
      tags: [Professional profile]
      operationId: replaceOwnWeeklyAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyAvailabilityRequest' }
      responses:
        '200':
          description: Reglas semanales reemplazadas atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/availability-exceptions:
    post:
      tags: [Professional profile]
      operationId: createOwnAvailabilityException
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityExceptionRequest' }
      responses:
        '201':
          description: Excepción creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/verification-submissions:
    post:
      tags: [Professional verification]
      operationId: submitProfessionalEvidence
      description: Registra la referencia de un objeto ya almacenado en almacenamiento privado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationSubmissionRequest' }
      responses:
        '201':
          description: Evidencia registrada como pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /psychologists/me/verification-evidence/policy:
    get:
      tags: [Professional verification]
      operationId: getProfessionalEvidenceUploadPolicy
      responses:
        '200':
          description: Modo de carga habilitado para la sesión profesional.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUploadPolicyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /psychologists/me/verification-evidence/local/{licenseId}:
    put:
      tags: [Professional verification]
      operationId: uploadLocalQaProfessionalEvidence
      description: >-
        Ruta exclusiva de desarrollo para QA local. Se rechaza cuando ENABLE_LOCAL_QA
        está desactivado y la configuración no puede habilitarse en producción.
      x-local-qa-only: true
      parameters:
        - name: licenseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Evidence-File-Name
          in: header
          required: true
          schema: { type: string, maxLength: 540 }
          description: Nombre original codificado con encodeURIComponent.
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Archivo privado almacenado y solicitud de verificación creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfessionalResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: El archivo supera el límite configurado.
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/catalogs/specialties:
    post:
      tags: [Catalogs]
      operationId: createSpecialty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Specialty' }
      responses:
        '201':
          description: Especialidad creada y auditada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialtyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/catalogs/specialties/{code}:
    patch:
      tags: [Catalogs]
      operationId: setSpecialtyStatus
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, maxLength: 60 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200':
          description: Estado del catálogo actualizado y auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialtyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/psychologist-verifications:
    get:
      tags: [Professional verification]
      operationId: listPendingProfessionalVerifications
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Cola paginada de evidencias pendientes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationQueueResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/psychologist-verifications/{submissionId}/decision:
    post:
      tags: [Professional verification]
      operationId: decideProfessionalVerification
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationDecisionRequest' }
      responses:
        '204': { description: Decisión persistida, auditada y publicada en outbox. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests:
    post:
      tags: [Service requests]
      operationId: createServiceRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequestRequest' }
      responses:
        '201':
          description: Solicitud creada o resultado idempotente recuperado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /service-requests/me:
    get:
      tags: [Service requests]
      operationId: listOwnServiceRequests
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ServiceRequestStatus' } }
      responses:
        '200':
          description: Página de solicitudes del paciente autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/policy:
    get:
      tags: [Service requests]
      operationId: getServiceRequestPolicy
      responses:
        '200':
          description: Límites públicos del flujo para el cliente autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestPolicyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /service-requests/eligible:
    get:
      tags: [Service requests]
      operationId: listEligibleServiceRequests
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, BIDDING] } }
      responses:
        '200':
          description: Proyección minimizada de solicitudes abiertas compatibles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleServiceRequestPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{requestId}:
    get:
      tags: [Service requests]
      operationId: getServiceRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud visible por propiedad, oferta propia o elegibilidad actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{requestId}/cancel:
    post:
      tags: [Service requests]
      operationId: cancelServiceRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud propia cancelada; no admite cuerpo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{requestId}/offers:
    post:
      tags: [Service requests]
      operationId: createOwnServiceOffer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceOfferRequest' }
      responses:
        '201':
          description: Oferta única atribuida al profesional autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOfferResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Service requests]
      operationId: listServiceRequestOffers
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Ofertas visibles únicamente para el paciente propietario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOfferListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{requestId}/offers/{offerId}/withdraw:
    post:
      tags: [Service requests]
      operationId: withdrawOwnServiceOffer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Oferta propia pendiente retirada; no admite cuerpo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOfferResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{requestId}/offers/{offerId}/accept:
    post:
      tags: [Service requests]
      operationId: acceptServiceOffer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Oferta aceptada, competidoras rechazadas y relación creada atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptanceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /conversations/policy:
    get:
      tags: [Messaging]
      operationId: getMessagingPolicy
      responses:
        '200':
          description: Límites de mensajería que debe aplicar el cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagingPolicyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /conversations:
    get:
      tags: [Messaging]
      operationId: listOwnConversations
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversaciones activas o pausadas donde participa la sesión actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /conversations/{conversationId}:
    get:
      tags: [Messaging]
      operationId: getOwnConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversación visible para el participante autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/messages:
    get:
      tags: [Messaging]
      operationId: listConversationMessages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [before, after], default: before }
      responses:
        '200':
          description: Página cronológica de mensajes de texto autorizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Messaging]
      operationId: sendConversationMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
