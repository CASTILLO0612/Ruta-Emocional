openapi: 3.1.0
info:
  title: Ruta Emocional API
  version: 1.0.0-draft
  description: Contrato inicial ejecutable del primer flujo vertical de identidad.
servers:
  - url: http://localhost:5000/api/v1
    description: Desarrollo local
tags:
  - name: Health
  - name: Auth
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: El proceso está activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Dependencias críticas disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register/patient:
    post:
      tags: [Auth]
      operationId: registerPatient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '201':
          description: Cuenta y perfil de paciente creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register/psychologist:
    post:
      tags: [Auth]
      operationId: registerPsychologist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPsychologistRequest'
      responses:
        '201':
          description: Cuenta, perfil y licencia pendiente creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 40
                  maxLength: 300
      responses:
        '200':
          description: Tokens rotados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Sesión actual revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      responses:
        '204':
          description: Todas las sesiones del usuario fueron revocadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Identidad y capacidades actuales.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/CurrentUser'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterPatientRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    RegisterPsychologistRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, license]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        license:
          type: object
          additionalProperties: false
          required: [authority, number]
          properties:
            authority:
              type: string
              minLength: 2
              maxLength: 120
            number:
              type: string
              minLength: 4
              maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
        deviceName:
          type: string
          maxLength: 160
    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user, tokens]
          properties:
            user:
              $ref: '#/components/schemas/CurrentUser'
            tokens:
              $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TokenPairResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresInSeconds, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
        accessTokenExpiresInSeconds:
          type: integer
          minimum: 60
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    CurrentUser:
      type: object
      required: [id, displayName, email, status, roles, capabilities]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        photoUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DISABLED]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [patient, psychologist, administrator, clinical_auditor]
        psychologistVerificationStatus:
          type: [string, 'null']
          enum: [PENDING, VERIFIED, REJECTED, null]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
  responses:
    Unauthorized:
      description: La sesión no es válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: El recurso ya existe o cambió de estado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: La entrada no cumple el contrato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Se excedió el límite permitido.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: El servicio aún no está listo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
security:
  - bearerAuth: []
