name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - postgresql-migration

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_DB: ruta_emocional_ci
          POSTGRES_USER: ruta_emocional_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruta_emocional_ci -d ruta_emocional_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ruta_emocional_ci:ci-only-password@localhost:5432/ruta_emocional_ci?schema=public
      TEST_DATABASE_URL: postgresql://ruta_emocional_ci:ci-only-password@localhost:5432/ruta_emocional_ci?schema=public
      ADMIN_DATABASE_URL: postgresql://ruta_emocional_ci:ci-only-password@localhost:5432/ruta_emocional_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Reject legacy MongoDB runtime dependencies
        shell: bash
        run: |
          if git grep -n -E 'mongoose|MONGO_URI|ENABLE_LEGACY_MONGO_ROUTES' -- backend/src backend/package.json backend/package-lock.json; then
            echo 'Legacy MongoDB runtime code is not allowed.'
            exit 1
          fi

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Apply all migrations from zero
        working-directory: backend
        run: npm run db:migrate:deploy

      - name: Validate Prisma schema
        working-directory: backend
        run: npm run db:validate

      - name: Verify least-privilege runtime grants
        working-directory: backend
        run: |
          psql -X -v application_role=ruta_emocional_runtime_ci -f prisma/operations/ensure_runtime_role.sql "$ADMIN_DATABASE_URL"
          psql -X -v application_role=ruta_emocional_runtime_ci -f prisma/operations/grant_runtime_role.sql "$ADMIN_DATABASE_URL"
          psql -X -v application_role=ruta_emocional_runtime_ci -f prisma/operations/verify_runtime_role.sql "$ADMIN_DATABASE_URL"

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: npm run test:integration

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend type safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
